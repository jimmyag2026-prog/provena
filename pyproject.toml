[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provena-ledger"
dynamic = ["version"]
description = "A ledger of experimental data and process, kept encrypted and backed by proof."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://sparkscience.xyz/provena/"
Source = "https://github.com/jimmyag2026-prog/provena"
Changelog = "https://github.com/jimmyag2026-prog/provena/blob/main/CHANGELOG.md"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
client = ["httpx[socks]>=0.27"]
s3 = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
provena = "provena.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx[socks]>=0.27", "fastapi>=0.110", "uvicorn>=0.29",
       "boto3>=1.34", "moto[s3]>=5.0", "psycopg[binary]>=3.1"]

[tool.hatch.version]
path = "src/provena/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/provena"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
